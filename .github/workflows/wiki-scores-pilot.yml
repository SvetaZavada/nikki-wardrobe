name: Wiki Scores Pilot
on:
  push:
    paths:
      - 'tools/wiki_scores_pilot.py'
      - '.github/workflows/wiki-scores-pilot.yml'
  workflow_dispatch:
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4
      - name: Test extraction on 15 wiki pages
        run: python tools/wiki_scores_pilot.py
      - name: Upload pilot results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wiki-scores-pilot
          path: |
            wiki-scores-pilot.json
            wiki-scores-pilot-report.json
          if-no-files-found: warn
