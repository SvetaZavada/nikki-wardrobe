name: Collect Wiki Styling Scores
on:
  push:
    paths:
      - 'tools/wiki_scores_all.py'
      - '.github/workflows/wiki-scores-all.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 3,9,15,21 * * *'
permissions:
  contents: write
concurrency:
  group: wiki-score-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4
      - name: Collect next 120 unprocessed clothing records
        run: python tools/wiki_scores_all.py --limit 120 --delay 2
      - name: Persist verified scores and progress
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/wiki-scores.json data/wiki-scores-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Update verified Wiki styling scores and scan progress"
            git push
          fi
      - name: Upload full scan checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wiki-scores-checkpoint
          path: |
            data/wiki-scores.json
            data/wiki-scores-status.json
          if-no-files-found: warn
